spring.application.name=multithreading-lesson

# Maksymalna liczba wątków Tomcata obsługujących żądania (domyślnie 200)
server.tomcat.threads.max=200

# Java 21 + Spring Boot 3.2+: wątki wirtualne dla Tomcata i @Async jedną linią.
# Uwaga: przy true Spring Boot używa wirtualnych wątków dla własnego executora,
# ale nasz bean "lessonAsyncExecutor" z AsyncConfig nadal jest pulą platformową.
spring.threads.virtual.enabled=false
